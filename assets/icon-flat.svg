  partsmith mark, background-less variant of assets/icon.svg. Transparent
  ground, partsmith body colors + section-fill ember (#c98f6b). For
  README headers, docs, and in-app use on light or dark surfaces. The
  rounded-square tile (assets/icon.svg) is the app/favicon form.

  Rendered at 256x256; scales cleanly.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="partsmith — forging a digital part">
  <defs>
    <linearGradient id="anvilF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6b7e"/>
      <stop offset="1" stop-color="#3a4a5e"/>
    </linearGradient>
    <linearGradient id="cubeTopF" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e8a266"/>
      <stop offset="1" stop-color="#c98f6b"/>
    </linearGradient>
    <linearGradient id="cubeLeftF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aebfd4"/>
      <stop offset="1" stop-color="#8497ad"/>
    </linearGradient>
    <linearGradient id="cubeRightF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8499"/>
      <stop offset="1" stop-color="#566a7e"/>
    </linearGradient>
  </defs>

  <!-- digital part (centered x=128) -->
  <g stroke="#2f3d4c" stroke-width="2" stroke-linejoin="round">
    <polygon points="86,66 128,89 128,133 86,110" fill="url(#cubeLeftF)"/>
    <polygon points="170,66 128,89 128,133 170,110" fill="url(#cubeRightF)"/>
    <polygon points="128,43 170,66 128,89 86,66" fill="url(#cubeTopF)"/>
  </g>
  <g fill="#eef3f9" stroke="#2f3d4c" stroke-width="1.2">
    <circle cx="128" cy="43" r="3.4"/>
    <circle cx="170" cy="66" r="3.4"/>
    <circle cx="86"  cy="66" r="3.4"/>
    <circle cx="128" cy="89" r="3.1"/>
  </g>

  <!-- sparks -->
  <g fill="#c98f6b">
    <path d="M128 142 l3.2 7 7 3.2 -7 3.2 -3.2 7 -3.2 -7 -7 -3.2 7 -3.2 z"/>
    <path d="M147 132 l1.8 4 4 1.8 -4 1.8 -1.8 4 -1.8 -4 -4 -1.8 4 -1.8 z" fill-opacity="0.85"/>
  </g>

  <!-- anvil — symmetric about x=128, rounded horn -->
  <path fill="url(#anvilF)" d="M72 163 Q72 157 79 155 L100 153 L180 153 Q186 153 186 159 L186 167 Q186 172 180 172 L138 172 L136 190 L158 190 L162 214 L146 214 L140 203 L116 203 L110 214 L94 214 L98 190 L120 190 L118 172 L100 172 Q82 171 72 163 Z"/>
  <path d="M100 172 L186 172 L186 175 L100 175 Z" fill="#2c3a49" fill-opacity="0.40"/>
</svg>
