#
# Local-dev compose. Port bound to loopback only — partsmith does no
# authentication, so direct LAN exposure is unsafe. For network access,
# put an authenticating reverse proxy in front of it.
#
# v0.1.2: removed `internal: true` from partsmith-net. The flag
# blocks container egress (which we wanted) but on some Docker
# versions also breaks port publishing through docker-proxy,
# making the published port unreachable from the host. The named
# bridge network is kept for cosmetic isolation but no longer
# blocks outbound. Outbound blocking will be reintroduced in v0.2
# via host-level nftables DROP rules on this subnet, which is
# Docker-version-portable and doesn't break port mapping.

services:
  partsmith:
    build: .
    container_name: partsmith
    hostname: partsmith
    restart: unless-stopped
    networks:
      - partsmith-net
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./workspace:/workspace
      - ./renders:/renders
    mem_limit: 4g
    cpus: 2.0
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import urllib.request,sys;
          r=urllib.request.urlopen("http://localhost:8123/health");
          sys.exit(0 if r.status==200 else 1)'
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  partsmith-net:
    driver: bridge
