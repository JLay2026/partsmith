[project]
name = "partsmith"
version = "0.3.2"
description = "Minimal headless parametric-CAD server (build123d + REST + MCP)"
license = { text = "MIT" }
authors = [
    { name = "JLay2026" }
]
requires-python = ">=3.11"
readme = "README.md"
keywords = ["cad", "build123d", "rest", "mcp", "3d-printing", "parametric"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "build123d>=0.8.0",
    "trimesh>=4.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "requests>=2.28.0",  # integration tests HTTP client (v0.3.1+)
]

[project.urls]
Homepage = "https://github.com/JLay2026/partsmith"
Repository = "https://github.com/JLay2026/partsmith"
Issues = "https://github.com/JLay2026/partsmith/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
# Prepend repo root to sys.path so `from src.X import Y` works without
# requiring `pip install -e .`. The lightweight CI job (ci.yml pytest)
# deliberately skips the heavy editable install (would pull build123d
# + OpenCASCADE wheel), so this is the cleanest way to make
# tests/test_*.py importable. Added v0.3.1.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
