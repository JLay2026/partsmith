---
# Integration tests against a real partsmith container.
#
# Builds the image from the current commit with the runner's own Docker,
# starts it, waits for /health, then runs tests/integration/ with
# PARTSMITH_URL pointing at the loopback port.
#
# Existence of this workflow is the v0.3.1 deliverable per ROADMAP
# Theme 4. Catches the kind of regressions that bit v0.2.0 -> v0.2.3
# (MCP lifespan, double-prefix path, scheme downgrade, DNS rebinding)
# in CI rather than in production. Since 0.4.3 release.yml calls it
# before publishing, so a tag ships only an image this suite passed.

name: Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: Container roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build partsmith image
        run: docker build -t partsmith:test .

      - name: Start partsmith container
        run: |
          docker run -d --name partsmith \
            -p 127.0.0.1:8123:8123 \
            partsmith:test
          echo "Waiting for /health (up to 90s)..."
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8123/health >/dev/null 2>&1; then
              echo "partsmith ready after ${i} attempt(s)"
              curl -s http://127.0.0.1:8123/health
              echo
              exit 0
            fi
            sleep 2
          done
          echo "partsmith failed to become healthy in 90s"
          docker logs partsmith
          exit 1

      - name: The image reports the packaged version
        run: |
          want="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/__init__.py)"
          curl -fsS http://127.0.0.1:8123/health | grep -q "\"version\":\"$want\""

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Install integration test deps
        run: pip install pytest requests

      - name: Run integration tests
        env:
          PARTSMITH_URL: http://127.0.0.1:8123
        run: pytest tests/integration/ -v --tb=short

      - name: Container logs (on failure)
        if: failure()
        run: docker logs partsmith

      - name: Cleanup
        if: always()
        run: docker rm -f partsmith || true
