---
# SPDX-FileCopyrightText: 2026 JLay2026
# SPDX-License-Identifier: MIT
#
# A vX.Y.Z tag on a commit that is on main, equal to src/__init__.py's __version__
# and pyproject.toml's version, publishes ghcr.io/jlay2026/partsmith:X.Y.Z
# (linux/amd64), signed keyless with cosign (GitHub OIDC) and carrying a signed
# SPDX SBOM attestation. Nothing is pushed unless CI and the container
# integration suite pass on the tagged commit. No `latest`, `main` or `sha-`
# tags since 0.4.3: consumers pin X.Y.Z@digest and verify against this workflow:
#   cosign verify --certificate-identity-regexp '^https://github\.com/JLay2026/partsmith/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com <image@digest>
#
# The job that holds the signing identity runs no unpinned code: the image is
# built with the runner's own Docker, every action is pinned by commit (the
# shared JLay2026/.github actions included, which run inside this job so the
# certificate names this workflow), and cosign and syft match the
# mcp-factory-host image gate's.
#
# The ghcr.io/jlay2026/partsmith package is public (repo Settings -> Packages).

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jlay2026/partsmith

jobs:
  ci:
    uses: ./.github/workflows/ci.yml  # self-repository syntax: pinned to the running commit

  integration:
    uses: ./.github/workflows/integration.yml

  publish:
    needs: [ci, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: guard
        name: The tag is on main and matches the package version
        uses: JLay2026/.github/actions/release-guard@59ea76cf3c476d8ef1cabf39919626900f0102ff  # v1.0.1
        with:
          version-file: src/__init__.py

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Build and push (runner Docker, linux/amd64)
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          docker build \
            --label org.opencontainers.image.title=partsmith \
            --label org.opencontainers.image.description="Minimal headless parametric-CAD server (build123d + REST + MCP)" \
            --label org.opencontainers.image.licenses=MIT \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          echo "ref=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $digest"

      - name: Sign, attest the SBOM, verify, print the pin
        uses: JLay2026/.github/actions/sign-attest-verify@59ea76cf3c476d8ef1cabf39919626900f0102ff  # v1.0.1
        with:
          ref: ${{ steps.push.outputs.ref }}
          version: ${{ steps.guard.outputs.version }}
